name: Trigger Runtime Build

on:
  workflow_run:
    workflows: ["CI Test"]
    types:
      - completed
    branches: [ "main" ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch in runtime repo'
        required: false
        default: 'main'
        type: choice
        options:
          - main
          - develop

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: |
      (github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Windows runtime repository workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RUNTIME_REPO_TOKEN }}
          repository: shenshuoyaoyouguang/Umi-OCR_runtime_windows
          event-type: build-request
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref }}",
              "source_tag": "${{ steps.vars.outputs.tag }}",
              "is_release": "${{ steps.vars.outputs.is_release }}",
              "target_branch": "${{ github.event.inputs.target_branch || 'main' }}",
              "triggered_by": "${{ github.actor }}",
              "workflow_run_id": "${{ github.event.workflow_run.id }}"
            }

      - name: Trigger Linux runtime repository workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RUNTIME_REPO_TOKEN }}
          repository: shenshuoyaoyouguang/Umi-OCR_runtime_linux
          event-type: build-request
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref }}",
              "source_tag": "${{ steps.vars.outputs.tag }}",
              "is_release": "${{ steps.vars.outputs.is_release }}",
              "target_branch": "${{ github.event.inputs.target_branch || 'main' }}",
              "triggered_by": "${{ github.actor }}",
              "workflow_run_id": "${{ github.event.workflow_run.id }}"
            }

      - name: Confirm trigger
        run: |
          echo "已触发运行时仓库构建"
          echo "源仓库: ${{ github.repository }}"
          echo "源 SHA: ${{ github.sha }}"
          echo "源引用: ${{ github.ref }}"
          echo "标签: ${{ steps.vars.outputs.tag }}"
          echo "是否发布: ${{ steps.vars.outputs.is_release }}"