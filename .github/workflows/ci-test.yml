name: CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        test-script:
          - test_paddleocr_direct.py
          - test_paddleocr_plugin.py
          - test_paddleocr_plugin_simple.py
          - test_paddleocr_raw.py
          - test_ocr_recognition.py

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          # 安装 PaddleOCR 相关依赖
          pip install paddlepaddle paddleocr

      - name: Run test - ${{ matrix.test-script }}
        run: |
          echo "Running test: ${{ matrix.test-script }}"
          python ${{ matrix.test-script }}

      - name: Test report
        if: always()
        run: |
          echo "测试完成"
